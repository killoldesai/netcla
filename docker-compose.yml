services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SITE_URL: ${SITE_URL}
      STAGING: ${STAGING:-true}
      SESSION_SECRET: ${SESSION_SECRET}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY}
      AI_MAX_BATCH: ${AI_MAX_BATCH:-10}
      GA4_ID: ${GA4_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-12000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
